<div class="d-flex flex-column vh-100">

  <!-- Top navigation -->
  <app-navbar (search)="onSearch($event)"></app-navbar>

  <!-- Main body: sidebar + content -->
  <div class="d-flex flex-grow-1 overflow-hidden">
    <app-sidebar class="d-none d-md-block"></app-sidebar>

    <main class="flex-grow-1 overflow-auto bg-dark p-3 p-md-4">
      <app-song-list [searchTerm]="searchTerm"></app-song-list>
    </main>
  </div>

  <!-- Bottom player bar -->
  <app-player></app-player>

</div>
